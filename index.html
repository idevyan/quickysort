<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura de Datos - Selection Sort</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="workspace">
        <!-- HUD SUPERIOR GLASSMORPHISM -->
        <header class="glass-panel hud-top">
            <div class="hud-col">
                <span class="sub-tag">ESTRUCTURA DE DATOS</span>
                <h1 class="main-title">DINAMICA DE SELECTION SORT</h1>
            </div>
            <div class="hud-col center">
                <span class="label">ESTADO DE OPERACION</span>
                <div class="terminal-text" id="status-terminal">SISTEMA EN ESPERA // PRESIONE EJECUTAR</div>
            </div>
            <div class="hud-col right">
                <span class="sub-tag">DESARROLLADOR</span>
                <div class="author-tag">BRYAN GONZALEZ</div>
            </div>
        </header>

        <!-- ESCENARIO MECANICO VECTORIAL (SVG INTERACTIVO) -->
        <main class="viewport-box">
            <svg id="stage-svg" viewBox="0 0 1000 480" preserveAspectRatio="xMidYMid meet"></svg>
        </main>

        <!-- PANEL DE CONTROL INFERIOR GLASSMORPHISM -->
        <footer class="glass-panel hud-bottom">
            <div class="control-group">
                <button id="btn-reset" class="btn-tech" onclick="setupArray()">NUEVO ARREGLO</button>
                <button id="btn-run" class="btn-tech primary" onclick="runSelectionSort()">EJECUTAR ORDENAMIENTO</button>
            </div>

            <div class="telemetry-legend">
                <div class="legend-box"><span class="box-indicator sorted"></span> PROCESADO (ORDENADO)</div>
                <div class="legend-box"><span class="box-indicator pivot"></span> PIVOTE CARRO 1</div>
                <div class="legend-box"><span class="box-indicator min"></span> EVALUACION / MINIMO</div>
                <div class="legend-box"><span class="box-indicator pending"></span> PENDIENTE</div>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
