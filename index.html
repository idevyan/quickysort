<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selection Sort - Bryan Gonzalez</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Panel Superior Glassmorphism -->
    <header class="glass-panel header-panel">
        <div class="header-titles">
            <span class="badge">ESTRUCTURA DE DATOS</span>
            <h1>Dinámica de Selection Sort</h1>
            <p class="author">Autor: <strong>Bryan Gonzalez</strong></p>
        </div>
        <div class="status-display">
            <div class="status-indicator"></div>
            <span id="status-text">Sistema listo. Presiona "Iniciar Dinámica".</span>
        </div>
    </header>

    <!-- Escenario Principal (Cuadrícula + Grúa) -->
    <main class="stage-container">
        <!-- Riel superior -->
        <div class="rail"></div>

        <!-- SVG para dibujar el carro, cables y ganchos de la grúa -->
        <svg id="crane-svg" class="crane-svg"></svg>

        <!-- Contenedor donde se mueven los bloques -->
        <div id="blocks-stage" class="blocks-stage"></div>

        <!-- Línea del suelo -->
        <div class="floor-line"></div>
    </main>

    <!-- Panel Inferior de Controles Glassmorphism -->
    <footer class="glass-panel controls-panel">
        <button id="btn-reset" class="btn btn-secondary" onclick="initSimulation()">
            🔄 Generar Nuevo Arreglo
        </button>
        <div class="legend">
            <span class="legend-item"><span class="dot sorted"></span> Ordenado</span>
            <span class="legend-item"><span class="dot pivot"></span> Pivote [i]</span>
            <span class="legend-item"><span class="dot min"></span> Mínimo / Comparando</span>
        </div>
        <button id="btn-start" class="btn btn-primary" onclick="startSelectionSort()">
            ▶ Iniciar Dinámica
        </button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
